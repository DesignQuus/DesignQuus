name: Reliability Phase 4B

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ai-hvac-production-hardening-v1.2-20260709
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliability-phase4b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-services:
    name: Phase 4B Application Reliability Services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm install

      - name: Validate v1.2 Phase 4B contract
        run: |
          npm run validate:v12
          npm run validate:phase4b

      - name: Run reliability unit tests
        run: npm run test:reliability

      - name: Build API
        run: npm run build:api

      - name: Dependency audit
        run: npm audit --audit-level=low

  runtime-api-probes:
    name: Phase 4B Reliability Runtime API Probes
    needs: application-services
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_DB: hvac
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: phase4b-runtime-password
      AUTH_SHARED_SECRET: phase4b-runtime-auth-secret-0123456789abcdef
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Apply migrations
        run: docker compose run --rm migrations

      - name: Run database reliability certification
        run: docker compose run --rm db-smoke

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/v1/health/ready > /tmp/phase4b-ready.json; then
              cat /tmp/phase4b-ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Load reliability API fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm db-smoke /bin/sh -c \
            'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /app/scripts/reliability_api_fixture.sql'

      - name: Run reliability API probe
        env:
          BASE_URL: http://localhost:3001/v1
        run: python scripts/reliability_api_probe.py

      - name: Runtime diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
