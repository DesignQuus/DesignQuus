name: Runtime Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v1.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/cad-worker/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r workers/cad-worker/requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Regression tests
        run: |
          npm run test:calc
          npm run test:cad

      - name: Production builds
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=low

  runtime-certification:
    name: Docker / PostGIS Runtime Certification
    needs:
      - source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/cad-worker/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r workers/cad-worker/requirements.txt

      - name: Run certification
        env:
          POSTGRES_DB: hvac
          POSTGRES_USER: hvac
          POSTGRES_PASSWORD: runtime-certification-password
          KEEP_RUNTIME_STACK: "1"
        run: sh scripts/certify_runtime_v101.sh

      - name: Print certificate
        if: always()
        run: |
          test -f artifacts/runtime-certificate-v1.0.1.json \
            && cat artifacts/runtime-certificate-v1.0.1.json \
            || true

      - name: Runtime logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
