name: Production Hardening v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ai-hvac-production-hardening-v1.2-20260709
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-hardening-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: v1.2 Source and Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm install

      - name: Validate v1.2 hardening contract
        run: npm run validate:v12

      - name: Build API
        run: npm run build:api

      - name: Dependency audit
        run: npm audit --audit-level=low

  runtime-probes:
    name: v1.2 Runtime Probe Gate
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_DB: hvac
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: v12-runtime-probe-password
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start database
        run: docker compose up -d db

      - name: Apply migrations
        run: docker compose run --rm migrations

      - name: Run database smoke test
        run: docker compose run --rm db-smoke

      - name: Start API
        run: docker compose up -d api

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/v1/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Verify liveness and request ID propagation
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID='v12-runtime-probe'
          curl --fail --silent \
            --dump-header /tmp/headers.txt \
            --header "x-request-id: ${REQUEST_ID}" \
            http://localhost:3001/v1/health/live \
            > /tmp/live.json
          cat /tmp/live.json
          cat /tmp/headers.txt
          ACTUAL_REQUEST_ID="$(tr -d '\r' < /tmp/headers.txt | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }' | tail -n 1)"
          test "$ACTUAL_REQUEST_ID" = "$REQUEST_ID"

      - name: Runtime diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
