name: Production Hardening v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ai-hvac-production-hardening-v1.2-20260709
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-hardening-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: v1.2 Source and Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm install

      - name: Validate v1.2 hardening contract
        run: npm run validate:v12

      - name: Build API
        run: npm run build:api

      - name: Dependency audit
        run: npm audit --audit-level=low

  runtime-probes:
    name: v1.2 Runtime Probe Gate
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_DB: hvac
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: v12-runtime-probe-password
      AUTH_SHARED_SECRET: v12-runtime-probe-auth-secret-0123456789abcdef
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start database
        run: docker compose up -d db

      - name: Apply migrations
        run: docker compose run --rm migrations

      - name: Run database and tenant isolation smoke tests
        run: docker compose run --rm db-smoke

      - name: Start API
        run: docker compose up -d api

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/v1/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Verify liveness and request ID propagation
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID='v12-runtime-probe'
          curl --fail --silent \
            --dump-header /tmp/headers.txt \
            --header "x-request-id: ${REQUEST_ID}" \
            http://localhost:3001/v1/health/live \
            > /tmp/live.json
          cat /tmp/live.json
          cat /tmp/headers.txt
          ACTUAL_REQUEST_ID="$(tr -d '\r' < /tmp/headers.txt | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }' | tail -n 1)"
          test "$ACTUAL_REQUEST_ID" = "$REQUEST_ID"

      - name: Verify metrics and stable error envelope
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:3001/v1/metrics > /tmp/metrics.txt
          cat /tmp/metrics.txt
          grep -q '^# HELP ai_hvac_http_requests_total' /tmp/metrics.txt
          grep -q '^ai_hvac_build_info{' /tmp/metrics.txt

          ERROR_REQUEST_ID='v12-error-probe'
          STATUS_CODE="$(curl --silent \
            --output /tmp/error.json \
            --write-out '%{http_code}' \
            --header "x-request-id: ${ERROR_REQUEST_ID}" \
            http://localhost:3001/v1/does-not-exist)"
          cat /tmp/error.json
          test "$STATUS_CODE" = '404'

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/error.json').read_text(encoding='utf-8'))
          assert payload['statusCode'] == 404
          assert payload['errorCode'] == 'HTTP_404'
          assert payload['requestId'] == 'v12-error-probe'
          assert payload['path'].endswith('/does-not-exist')
          PY

      - name: Verify authentication and RBAC boundaries
        shell: bash
        run: |
          set -euo pipefail
          TENANT_ID='10000000-0000-7000-8000-000000000000'
          JOB_ID='00000000-0000-7000-8000-000000000001'
          EXTRACTION_ID='00000000-0000-7000-8000-000000000002'
          PROTECTED_URL="http://localhost:3001/v1/import-jobs/${JOB_ID}/extractions"

          UNAUTH_STATUS="$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' "$PROTECTED_URL")"
          cat /tmp/unauth.json
          test "$UNAUTH_STATUS" = '401'

          BAD_SECRET_STATUS="$(curl --silent \
            --output /tmp/bad-secret.json \
            --write-out '%{http_code}' \
            --header 'x-auth-secret: wrong-secret' \
            --header 'x-user-id: runtime-probe-user' \
            --header 'x-user-role: OPERATOR' \
            --header "x-tenant-id: ${TENANT_ID}" \
            "$PROTECTED_URL")"
          cat /tmp/bad-secret.json
          test "$BAD_SECRET_STATUS" = '401'

          VALID_STATUS="$(curl --silent \
            --output /tmp/valid-auth.json \
            --write-out '%{http_code}' \
            --header "x-auth-secret: ${AUTH_SHARED_SECRET}" \
            --header 'x-user-id: runtime-probe-user' \
            --header 'x-user-role: OPERATOR' \
            --header "x-tenant-id: ${TENANT_ID}" \
            "$PROTECTED_URL")"
          cat /tmp/valid-auth.json
          test "$VALID_STATUS" = '200'

          FORBIDDEN_STATUS="$(curl --silent \
            --output /tmp/forbidden.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-auth-secret: ${AUTH_SHARED_SECRET}" \
            --header 'x-user-id: runtime-probe-user' \
            --header 'x-user-role: OPERATOR' \
            --header "x-tenant-id: ${TENANT_ID}" \
            --data '{"decision":"ACCEPTED"}' \
            "http://localhost:3001/v1/extractions/${EXTRACTION_ID}/review")"
          cat /tmp/forbidden.json
          test "$FORBIDDEN_STATUS" = '403'

          python - <<'PY'
          import json
          from pathlib import Path

          unauth = json.loads(Path('/tmp/unauth.json').read_text(encoding='utf-8'))
          bad_secret = json.loads(Path('/tmp/bad-secret.json').read_text(encoding='utf-8'))
          forbidden = json.loads(Path('/tmp/forbidden.json').read_text(encoding='utf-8'))

          assert unauth['errorCode'] == 'AUTH_GATEWAY_SECRET_INVALID'
          assert bad_secret['errorCode'] == 'AUTH_GATEWAY_SECRET_INVALID'
          assert forbidden['errorCode'] == 'AUTH_ROLE_FORBIDDEN'
          PY

      - name: Verify insecure production startup is blocked
        shell: bash
        run: |
          set -euo pipefail
          if docker compose run --rm --no-deps -e AUTH_SHARED_SECRET= api > /tmp/insecure-start.log 2>&1; then
            cat /tmp/insecure-start.log
            echo 'Insecure production API unexpectedly started' >&2
            exit 1
          fi
          cat /tmp/insecure-start.log
          grep -q 'Production startup blocked' /tmp/insecure-start.log

      - name: Runtime diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
