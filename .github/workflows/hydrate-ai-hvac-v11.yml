name: Hydrate AI HVAC v1.1 Full Source

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ai-hvac-full-source-v1.1-complete-20260709
    paths:
      - '.github/workflows/hydrate-ai-hvac-v11.yml'
      - 'source-bootstrap-v11/**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reconstruct and verify canonical source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT='source-bootstrap-v11'
          ZIP='/tmp/ai-hvac-v11-core-source.zip'
          EXPECTED='e119224c5786d761637dc466987f41b6db635a402b1a5ccb5ba86fba0101fcdd'

          # Historical transfer layout: part-001 is 20,000 Base64 chars;
          # parts 002-014 are 10,000 chars each. Together they already
          # cover the first 150,000 Base64 chars, so raw segment 015 is
          # intentionally skipped to avoid a 10,000-char overlap.
          cat "$ROOT"/part-{001..014}.b64 | base64 -d > "$ZIP"

          for n in $(seq 16 21); do
            i=$(printf '%03d' "$n")
            cat "$ROOT/part-${i}.bin" >> "$ZIP"
          done

          cat "$ROOT/part-022a.bin" >> "$ZIP"
          cat "$ROOT/part-022b.bin" >> "$ZIP"
          cat "$ROOT/part-023a.bin" >> "$ZIP"
          cat "$ROOT/part-023b.bin" >> "$ZIP"
          cat "$ROOT/part-024a.bin" >> "$ZIP"
          cat "$ROOT/part-024b.bin" >> "$ZIP"
          cat "$ROOT/part-025.bin" >> "$ZIP"

          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          echo "SOURCE_ZIP_SHA256_VERIFIED=$ACTUAL"

          FILE_COUNT=$(unzip -Z1 "$ZIP" | grep -v '/$' | wc -l | tr -d ' ')
          test "$FILE_COUNT" = '227'
          echo "SOURCE_FILE_COUNT_VERIFIED=$FILE_COUNT"

      - name: Hydrate repository with 227 runtime-core files
        shell: bash
        run: |
          set -euo pipefail
          ZIP='/tmp/ai-hvac-v11-core-source.zip'
          EXTRACT='/tmp/ai-hvac-v11-source'

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          unzip -q "$ZIP" -d "$EXTRACT"
          cp -a "$EXTRACT"/. .
          rm -rf source-bootstrap-v11

      - name: Commit hydrated full source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No hydration changes to commit'; exit 0; }
          git commit -m 'Hydrate AI HVAC v1.1 full source (227 files)'
          git push origin HEAD:"$TARGET_BRANCH"
